# /etc/nginx/sites-available/agora-catalog
#
# Домена пока нет, поэтому sslip.io — так же, как уже сделано для основной Агоры
# (agora.178.88.115.213.sslip.io) и мозга. TLS от certbot, автопродление.
# Появится домен — меняется только server_name и выпускается новый сертификат.
server {
    listen 80;
    server_name agora-catalog.178.88.115.213.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name agora-catalog.178.88.115.213.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/agora-catalog.178.88.115.213.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agora-catalog.178.88.115.213.sslip.io/privkey.pem;

    # Панель оператора и приём заявок — тут персональные данные, роботам не нужно.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/agora-catalog.access.log;
    error_log  /var/log/nginx/agora-catalog.error.log;
}
